<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style></head><body>
<svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024">
 <defs>
  <radialGradient id="bg" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#2b2724"/><stop offset="1" stop-color="#070605"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#7a5a24"/><stop offset=".22" stop-color="#ecd38b"/>
   <stop offset=".45" stop-color="#a8823e"/><stop offset=".7" stop-color="#f6e3a4"/><stop offset="1" stop-color="#806029"/>
  </linearGradient>
  <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cdbb92"/><stop offset="1" stop-color="#efe2c2"/></linearGradient>
  <pattern id="pagelines" width="12" height="6" patternUnits="userSpaceOnUse"><rect width="12" height="6" fill="url(#pages)"/><rect y="5" width="12" height="1" fill="#b39e70"/></pattern>
  <filter id="leather" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="7" result="fine"/>
   <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="5" result="pebble"/>
   <feComposite in="fine" in2="pebble" operator="arithmetic" k1="0" k2="0.4" k3="0.8" k4="0" result="n"/>
   <feDiffuseLighting in="n" lighting-color="#5a5652" surfaceScale="3.5" result="lit"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
   <feColorMatrix in="lit" type="matrix" values="0.46 0 0 0 -0.03  0 0.45 0 0 -0.03  0 0 0.44 0 -0.03  0 0 0 0 1" result="tex"/>
   <feComposite in="tex" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".7"/></filter>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".7" stop-color="#000" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
 </defs>
 <rect width="1024" height="1024" fill="url(#bg)"/>
<g transform="translate(512 512) scale(1.1) translate(-505 -512)">
 <g filter="url(#shadow)">
  <!-- page block peeking out on the right and bottom -->
  <rect x="300" y="196" width="460" height="652" rx="14" fill="url(#pagelines)"/>
  <!-- cover -->
  <rect x="250" y="176" width="490" height="660" rx="26" fill="#141210"/>
 </g>
 <rect x="250" y="176" width="490" height="660" rx="26" fill="#111" filter="url(#leather)"/>
 <rect x="250" y="176" width="70" height="660" rx="26" fill="url(#spine)"/>
 <rect x="320" y="176" width="3" height="660" fill="#000" opacity=".5"/>
 <rect x="250" y="176" width="490" height="660" rx="26" fill="url(#sheen)"/>
 <rect x="251.5" y="177.5" width="487" height="657" rx="25" fill="none" stroke="#4a443e" stroke-width="3"/>
 <!-- gold frame -->
 <rect x="352" y="222" width="344" height="568" rx="10" fill="none" stroke="url(#gold)" stroke-width="7"/>
 <rect x="370" y="240" width="308" height="532" rx="6" fill="none" stroke="url(#gold)" stroke-width="3"/>
 <!-- emblem -->
 <g transform="translate(524 506)">
  <circle r="104" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle r="62" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M0 -84 L13 -13 L84 0 L13 13 L0 84 L-13 13 L-84 0 L-13 -13 Z" fill="url(#gold)"/>
 </g>
 <!-- clasp -->
 <rect x="712" y="470" width="70" height="72" rx="12" fill="url(#gold)"/>
 <rect x="726" y="484" width="42" height="44" rx="8" fill="#2a2016" opacity=".55"/>
 <circle cx="747" cy="506" r="9" fill="url(#gold)"/>
</g>
</svg></body></html>
