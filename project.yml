name: AnswerBook
options:
  bundleIdPrefix: com.midjug3nine
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  HingeKit:
    url: https://github.com/MIDJUG3Nine/HingeKit.git
    from: 0.1.0
targets:
  AnswerBook:
    type: application
    platform: iOS
    sources:
      - AnswerBook
    dependencies:
      - package: HingeKit
      # The watch app ships inside the iPhone app (Embed Watch Content) and can also be installed on its own.
      - target: AnswerBookWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.midjug3nine.answerbook
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Answer Book
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  AnswerBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnswerBookTests
    dependencies:
      - target: AnswerBook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        DEVELOPMENT_TEAM: ""
  AnswerBookWatch:
    type: application
    platform: watchOS
    sources:
      - AnswerBookWatch
      # Shared with the iPhone app: the 365 answers, the deck, the book's look, fonts, textures and strings.
      - AnswerBook/Model
      - AnswerBook/Views/Theme.swift
      - AnswerBook/Resources/Fonts
      - AnswerBook/Resources/Assets.xcassets
      - AnswerBook/Resources/Localizable.xcstrings
      - AnswerBook/Resources/InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.midjug3nine.answerbook.watchkitapp
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Answer Book
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.midjug3nine.answerbook
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  AnswerBookWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - AnswerBookWatchTests
    dependencies:
      - target: AnswerBookWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        DEVELOPMENT_TEAM: ""
schemes:
  AnswerBook:
    build:
      targets:
        AnswerBook: all
        AnswerBookTests: [test]
    test:
      targets:
        - AnswerBookTests
      gatherCoverageData: true
    run:
      environmentVariables:
        HINGE_SIMULATOR: "1"
  AnswerBookWatch:
    build:
      targets:
        AnswerBookWatch: all
        AnswerBookWatchTests: [test]
    test:
      targets:
        - AnswerBookWatchTests
      gatherCoverageData: true
